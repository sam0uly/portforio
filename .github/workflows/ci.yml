name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Elm packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.elm
            elm-stuff
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}
          restore-keys: |
            elm-${{ runner.os }}-

      - name: Install Elm
        run: |
          npm install -g elm@0.19.3-0
          elm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Elm (optimized)
        run: elm make src/Main.elm --optimize --output=/dev/null

      - name: Build production bundle
        run: bun run build

      - name: Verify build artifacts
        run: |
          for file in \
            dist/index.html \
            dist/favicon.ico \
            dist/og-image.jpg \
            dist/robots.txt \
            dist/sitemap.xml \
            dist/llms.txt \
            dist/llms-full.txt \
            dist/images/sam0-avatar.png; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          ls -lh dist/assets/*.js dist/assets/*.css

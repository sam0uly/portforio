name: Link Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Main.elm'
      - 'index.html'
      - 'README.md'
      - 'public/llms.txt'
      - 'public/llms-full.txt'

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,429
            --exclude "^https://x\.com"
            --exclude "^mailto:"
            src/Main.elm
            index.html
            README.md
            public/llms.txt
            public/llms-full.txt
          fail: true
